<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">

    <link rel="stylesheet" href="./assets/css/style.css">

    <title>Student Management</title>
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-md-6 offset-md-3 text-center">
                <h1>Student Management</h1>
                <p class="sub-title">CRUD - Create, Read, Update, Delete</p>
            </div>
        </div>
    </div>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <div class="card bg-warning">
                    <div class="card-body">
                        <h3 class="text-center" id="formHeading">Add New Student</h3>
                        <div class="card">
                            <div class="card-body">
                                <form id="studentForm">
                                    <div class="form-row">
                                        <label for="studentName"><b>Student Name</b></label>
                                        <input class="form-control mb-4" type="text" id="studentName"
                                            placeholder="Enter student name" required>

                                        <label for="rollNo"><b>Roll Number</b></label>
                                        <input class="form-control mb-4" type="number" id="rollNo" placeholder="00"
                                            required>

                                        <label for="course"><b>Course</b></label>
                                        <input class="form-control mb-4" type="text" id="course"
                                            placeholder="Enter course" required>

                                        <button type="submit" id="submitBtn" class="btn btn-primary">+ Add</button>
                                        <button type="button" id="updateBtn"
                                            class="btn btn-primary d-none">Update</button>
                                    </div>
                                </form>
                            </div>
                        </div>

                        <!-- Table -->
                        <div class="card mt-4">
                            <div class="card-body">
                                <table class="table">
                                    <thead>
                                        <tr>
                                            <th>SR</th>
                                            <th>Name</th>
                                            <th>Roll</th>
                                            <th>Course</th>
                                            <th>Action</th>
                                        </tr>
                                    </thead>
                                    <tbody id="tbody">
                                        <tr>
                                            <td>1</td>
                                            <td>Gaurav</td>
                                            <td>21</td>
                                            <td>Java</td>
                                            <td><button class="btn btn-warning">Edit</button><button
                                                    class="btn btn-danger ml-1">Delete</button></td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
    <div id="spinner" class="d-none">
        <div class="spinner-border" role="status">
            <span class="sr-only">Loading...</span>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./assets/js/app.js"></script>
</body>

</html>
